#Hunger
- type: satiationIcon
  id: HungerIcon
  abstract: true
  priority: 5
  locationPreference: Right
  isShaded: true

- type: satiationIcon
  id: HungerIconOverfed
  parent: HungerIcon
  icon:
    sprite: /Textures/Interface/Misc/food_icons.rsi
    state: overfed

- type: satiationIcon
  id: HungerIconPeckish
  parent: HungerIcon
  icon:
    sprite: /Textures/Interface/Misc/food_icons.rsi
    state: peckish

- type: satiationIcon
  id: HungerIconStarving
  parent: HungerIcon
  icon:
    sprite: /Textures/Interface/Misc/food_icons.rsi
    state: starving

- type: satiationIcon
  id: HungerIconSatiated # DeltaV - shown by zookeeper HUD when animal hunger is Okay
  parent: HungerIcon
  icon:
    sprite: /Textures/_DV/Icons/zoo.rsi
    state: satiated

